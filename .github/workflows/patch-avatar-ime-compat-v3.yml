name: One-time avatar and Android IME compatibility patch v3

on:
  push:
    branches:
      - fix/minor-fixes-batch

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[avatar-ime-compat-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minor-fixes-batch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and run corrected patch script
        run: |
          python3 <<'EXTRACT'
          from pathlib import Path

          workflow = Path(".github/workflows/patch-avatar-ime-compat-v2.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          body_lines = []
          for line in lines[start:end]:
              body_lines.append(line[10:] if line.startswith("          ") else line)
          body = "\n".join(body_lines) + "\n"

          block_start = body.index('room_path = "app/messenger/room/[id].tsx"')
          block_end = body.index('Path("checks/messenger-avatar-ime-compat.mjs")', block_start)
          corrected = '''room_path = "app/messenger/room/[id].tsx"
          room_replacement = (
              '                // Android OEM keyboards can treat a custom commitContent\\n'
              '                // InputConnection as a separate editor and lose language-subtype\\n'
              '                // switching. Keep the normal IME connection on Android; users\\n'
              '                // still retain text formatting and the attachment picker.\\n'
              '                pasteAttachmentsEnabled={\\n'
              '                  Platform.OS !== "android" &&\\n'
              '                  canMedia &&\\n'
              '                  !attachmentDraft &&\\n'
              '                  !editingMessage &&\\n'
              '                  !composerBusy\\n'
              '                }'
          )
          replace_between(
              room_path,
              '                pasteAttachmentsEnabled={\\n                  canMedia &&',
              '\\n                textColor={colors.text}',
              room_replacement,
          )

          '''
          body = body[:block_start] + corrected + body[block_end:]
          Path("/tmp/apply-avatar-ime-patch.py").write_text(body, encoding="utf-8")
          EXTRACT
          python3 /tmp/apply-avatar-ime-patch.py
          rm -f .github/workflows/patch-avatar-ime-compat-v3.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate focused changes
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm run check:messenger-avatar-ime-compat
          npm run typecheck
          npx eslint services/messengerApi.ts services/messengerAvatarPreparation.ts app/messenger/profile.tsx 'app/messenger/room/[id].tsx' checks/messenger-avatar-ime-compat.mjs
          npx expo export --platform android --output-dir /tmp/forward-hockey-avatar-ime-export

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize avatar upload and Android IME"
          git push origin HEAD:fix/minor-fixes-batch
