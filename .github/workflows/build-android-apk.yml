name: Build Android APK 2.4.13

on:
  push:
    branches:
      - build/android-2.4.13-a326697

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact build commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Forward-Hockey-2.4.13-android-166.apk

      - name: Verify APK
        run: |
          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          APKSIGNER="$(find "$BUILD_TOOLS" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$BUILD_TOOLS" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs output/Forward-Hockey-2.4.13-android-166.apk
          "$AAPT" dump badging output/Forward-Hockey-2.4.13-android-166.apk | head -n 3
          sha256sum output/Forward-Hockey-2.4.13-android-166.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forward-Hockey-2.4.13-android-166
          path: output/Forward-Hockey-2.4.13-android-166.apk
          if-no-files-found: error
          compression-level: 0
