name: One-time avatar upload and IME compatibility patch

on:
  push:
    branches:
      - fix/minor-fixes-batch

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[avatar-ime-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minor-fixes-batch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply avatar upload and IME fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          avatar_old = '''export function uploadMessengerAvatar(file: {
            uri: string;
            name: string;
            type: string;
          }) {
            const form = new FormData();
            form.append("file", file as unknown as Blob);
            return messengerRequest<{ asset_id: string; url: string }>(
              "/users/me/avatar",
              { method: "PUT", body: form },
            );
          }
          '''
          avatar_new = '''const AVATAR_UPLOAD_TIMEOUT_MS = 120_000;

          interface MessengerAvatarUploadFile {
            uri: string;
            name: string;
            type: string;
          }

          function messengerAvatarExtension(file: MessengerAvatarUploadFile): string {
            const filenameExtension = /\\.([a-z0-9]{1,8})$/i.exec(file.name.trim())?.[1];
            if (filenameExtension) return filenameExtension.toLowerCase();
            if (file.type === "image/png") return "png";
            if (file.type === "image/webp") return "webp";
            if (file.type === "image/gif") return "gif";
            if (file.type === "image/heic" || file.type === "image/heif") return "heic";
            return "jpg";
          }

          function messengerAvatarUriScheme(uri: string): string {
            return /^([a-z][a-z0-9+.-]*):/i.exec(uri)?.[1]?.toLowerCase() ?? "relative";
          }

          async function prepareMessengerAvatarUpload(
            file: MessengerAvatarUploadFile,
            requestId: string,
          ): Promise<{ uploadFile: ExpoFile; stagedUri: string | null }> {
            let direct: ExpoFile | null = null;
            try {
              direct = new ExpoFile(file.uri);
            } catch {
              direct = null;
            }
            if (direct?.exists && Number(direct.size) > 0) {
              return { uploadFile: direct, stagedUri: null };
            }

            if (!FileSystem.cacheDirectory) {
              throw new Error("Локальное хранилище недоступно для подготовки аватара");
            }
            const stagedUri = `${FileSystem.cacheDirectory}messenger-avatar-${requestId}.${messengerAvatarExtension(file)}`;
            await FileSystem.deleteAsync(stagedUri, { idempotent: true }).catch(
              () => undefined,
            );
            try {
              // Android pickers can return content:// and vendor-specific asset
              // URIs. Materialise them in the application cache before forming
              // multipart data so the native uploader receives a readable Blob.
              await FileSystem.copyAsync({ from: file.uri, to: stagedUri });
              const staged = new ExpoFile(stagedUri);
              if (!staged.exists || Number(staged.size) < 1) {
                throw new Error("Подготовленный файл фотографии пуст");
              }
              return { uploadFile: staged, stagedUri };
            } catch (error) {
              await FileSystem.deleteAsync(stagedUri, { idempotent: true }).catch(
                () => undefined,
              );
              throw new Error("Выбранная фотография недоступна для загрузки", {
                cause: error,
              });
            }
          }

          export async function uploadMessengerAvatar(
            file: MessengerAvatarUploadFile,
            noRefresh = false,
          ): Promise<{ asset_id: string; url: string }> {
            const startedAt = Date.now();
            const requestId = messengerRequestId();
            let session = await loadMessengerSession();
            if (!session?.access_token) {
              throw new MessengerApiError(
                "Необходим вход",
                401,
                "authentication_required",
              );
            }
            if (
              !noRefresh &&
              session.refresh_token &&
              !isMessengerAccessTokenUsable(
                session.access_token,
                ACCESS_TOKEN_MIN_VALIDITY_MS,
              )
            ) {
              session = await ensureFreshMessengerSession();
            }

            const prepared = await prepareMessengerAvatarUpload(file, requestId);
            const uploadName =
              file.name.trim() ||
              `avatar-${requestId}.${messengerAvatarExtension(file)}`;
            const form = new FormData();
            form.append(
              "file",
              prepared.uploadFile as unknown as Blob,
              uploadName,
            );
            const controller = new AbortController();
            let timedOut = false;
            const timeout = setTimeout(() => {
              timedOut = true;
              controller.abort();
            }, AVATAR_UPLOAD_TIMEOUT_MS);

            messengerLog("info", "api.avatar_upload.started", {
              request_id: requestId,
              uri_scheme: messengerAvatarUriScheme(file.uri),
              file_size_bytes: Number(prepared.uploadFile.size),
              file_type: file.type || prepared.uploadFile.type,
              staged: Boolean(prepared.stagedUri),
            });

            try {
              const response = await expoFetch(
                `${MESSENGER_API_BASE_URL}/users/me/avatar`,
                {
                  method: "PUT",
                  headers: {
                    Accept: "application/json",
                    Authorization: `Bearer ${session.access_token}`,
                    "x-request-id": requestId,
                  },
                  body: form,
                  signal: controller.signal,
                },
              );
              const body = await response.text();
              const serverRequestId =
                response.headers.get("x-request-id") || requestId;
              messengerLog(
                response.ok ? "info" : "warn",
                "api.avatar_upload.response",
                {
                  request_id: serverRequestId,
                  status: response.status,
                  duration_ms: Date.now() - startedAt,
                },
              );
              if (
                response.status === 401 &&
                !noRefresh &&
                Boolean(session.refresh_token)
              ) {
                await refreshMessengerSession();
                return await uploadMessengerAvatar(file, true);
              }
              return parseUploadResponse<{ asset_id: string; url: string }>(
                response.status,
                body,
              );
            } catch (error) {
              const normalized = timedOut
                ? new Error("Загрузка аватара превысила 2 минуты", {
                    cause: error,
                  })
                : error;
              messengerLog("warn", "api.avatar_upload.failure", {
                request_id: requestId,
                duration_ms: Date.now() - startedAt,
                category:
                  normalized instanceof MessengerApiError ? "http" : "connection",
                status:
                  normalized instanceof MessengerApiError
                    ? normalized.status
                    : undefined,
                code:
                  normalized instanceof MessengerApiError
                    ? normalized.code
                    : undefined,
                message: messengerErrorMessage(normalized),
                details: messengerErrorDetails(normalized),
              });
              throw normalized;
            } finally {
              clearTimeout(timeout);
              if (prepared.stagedUri) {
                await FileSystem.deleteAsync(prepared.stagedUri, {
                  idempotent: true,
                }).catch(() => undefined);
              }
            }
          }
          '''
          replace_once("services/messengerApi.ts", avatar_old, avatar_new)

          kotlin_path = "modules/forward-rich-text-input/android/src/main/java/com/forwardhockey/richtext/ForwardRichTextInputView.kt"
          replace_once(
              kotlin_path,
              '''import android.view.inputmethod.InputConnection
          import android.view.inputmethod.InputConnectionWrapper
          import android.view.inputmethod.InputContentInfo
          ''',
              '''import android.view.inputmethod.InputConnection
          import androidx.core.view.inputmethod.EditorInfoCompat
          import androidx.core.view.inputmethod.InputConnectionCompat
          import androidx.core.view.inputmethod.InputContentInfoCompat
          ''',
          )
          replace_once(
              kotlin_path,
              '''private class ForwardRichEditText(context: Context) : EditText(context) {
            var richContentEnabled = false
            var onRichContent: ((InputContentInfo, Int) -> Boolean)? = null

            override fun onCreateInputConnection(outAttrs: EditorInfo): InputConnection? {
              val connection = super.onCreateInputConnection(outAttrs) ?: return null
              if (!richContentEnabled || Build.VERSION.SDK_INT < Build.VERSION_CODES.N_MR1) {
                return connection
              }
              outAttrs.contentMimeTypes = arrayOf("image/*")
              return object : InputConnectionWrapper(connection, false) {
                override fun commitContent(
                  inputContentInfo: InputContentInfo,
                  flags: Int,
                  opts: android.os.Bundle?
                ): Boolean {
                  if (onRichContent?.invoke(inputContentInfo, flags) == true) return true
                  return super.commitContent(inputContentInfo, flags, opts)
                }
              }
            }
          }
          ''',
              '''private class ForwardRichEditText(context: Context) : EditText(context) {
            var richContentEnabled = false
            var onRichContent: ((InputContentInfoCompat, Int) -> Boolean)? = null

            @Suppress("DEPRECATION")
            override fun onCreateInputConnection(outAttrs: EditorInfo): InputConnection? {
              val connection = super.onCreateInputConnection(outAttrs) ?: return null
              if (!richContentEnabled) return connection
              EditorInfoCompat.setContentMimeTypes(outAttrs, arrayOf("image/*"))
              return InputConnectionCompat.createWrapper(
                connection,
                outAttrs
              ) { inputContentInfo, flags, _ ->
                onRichContent?.invoke(inputContentInfo, flags) == true
              }
            }
          }
          ''',
          )
          replace_once(
              kotlin_path,
              '''  fun setPasteAttachmentsEnabled(value: Boolean) {
              if (editor.richContentEnabled == value) return
              editor.richContentEnabled = value
              editor.restartInputConnection()
            }
          ''',
              '''  fun setPasteAttachmentsEnabled(value: Boolean) {
              if (editor.richContentEnabled == value) return
              editor.richContentEnabled = value
              // Do not repeatedly restart an inactive IME connection while React
              // updates composer state. The next focus creates the correct
              // connection; a focused editor is refreshed once, asynchronously.
              if (editor.hasFocus()) {
                editor.post {
                  if (editor.hasFocus()) editor.restartInputConnection()
                }
              }
            }
          ''',
          )
          replace_once(
              kotlin_path,
              '''  private fun acceptRichContent(content: InputContentInfo, flags: Int): Boolean {
              if (!editor.richContentEnabled || Build.VERSION.SDK_INT < Build.VERSION_CODES.N_MR1) {
                return false
              }
          ''',
              '''  private fun acceptRichContent(content: InputContentInfoCompat, flags: Int): Boolean {
              if (!editor.richContentEnabled) return false
          ''',
          )
          replace_once(
              kotlin_path,
              "      flags and InputConnection.INPUT_CONTENT_GRANT_READ_URI_PERMISSION != 0",
              "      flags and InputConnectionCompat.INPUT_CONTENT_GRANT_READ_URI_PERMISSION != 0",
          )

          replace_once(
              "modules/forward-rich-text-input/android/build.gradle",
              '''dependencies {
            implementation 'com.facebook.react:react-android'
          }
          ''',
              '''dependencies {
            implementation 'com.facebook.react:react-android'
            implementation 'androidx.core:core:1.15.0'
          }
          ''',
          )

          replace_once(
              "app/messenger/room/[id].tsx",
              '''                pasteAttachmentsEnabled={
                            canMedia &&
                            !attachmentDraft &&
                            !editingMessage &&
                            !composerBusy
                          }
          ''',
              '''                pasteAttachmentsEnabled={canMedia}
          ''',
          )

          player_check_path = Path("checks/messenger-player-avatar.mjs")
          player_check = player_check_path.read_text(encoding="utf-8")
          player_marker = '''assert.match(reconciliationSource, /avatar_url:\\s*uploaded\\.url/);

          console.log("Messenger automatic player avatar checks passed.");
          '''
          player_replacement = '''assert.match(reconciliationSource, /avatar_url:\\s*uploaded\\.url/);

          const messengerApiSource = readFileSync(
            new URL("../services/messengerApi.ts", import.meta.url),
            "utf8",
          );
          assert.match(messengerApiSource, /new ExpoFile\\(file\\.uri\\)/);
          assert.match(messengerApiSource, /FileSystem\\.copyAsync\\(\\{ from: file\\.uri/);
          assert.match(
            messengerApiSource,
            /expoFetch\\(\\s*`\\$\\{MESSENGER_API_BASE_URL\\}\\/users\\/me\\/avatar`/,
          );
          assert.match(messengerApiSource, /api\\.avatar_upload\\.failure/);
          assert.doesNotMatch(
            messengerApiSource,
            /form\\.append\\("file", file as unknown as Blob\\)/,
          );

          console.log("Messenger automatic player avatar checks passed.");
          '''
          if player_check.count(player_marker) != 1:
              raise SystemExit("checks/messenger-player-avatar.mjs: marker not found")
          player_check_path.write_text(
              player_check.replace(player_marker, player_replacement, 1),
              encoding="utf-8",
          )

          keyboard_check_path = Path("checks/messenger-android-keyboard-avoidance.mjs")
          keyboard_check = keyboard_check_path.read_text(encoding="utf-8")
          keyboard_marker = '''assert.match(nativeInputSource, /enforceImeResize\\(\\)/);

          console.log("Messenger Android keyboard avoidance checks passed.");
          '''
          keyboard_replacement = '''assert.match(nativeInputSource, /enforceImeResize\\(\\)/);
          assert.match(nativeInputSource, /EditorInfoCompat\\.setContentMimeTypes/);
          assert.match(nativeInputSource, /InputConnectionCompat\\.createWrapper/);
          assert.match(
            nativeInputSource,
            /InputConnectionCompat\\.INPUT_CONTENT_GRANT_READ_URI_PERMISSION/,
          );
          assert.doesNotMatch(nativeInputSource, /InputConnectionWrapper/);
          assert.match(roomSource, /pasteAttachmentsEnabled=\\{canMedia\\}/);

          console.log("Messenger Android keyboard avoidance checks passed.");
          '''
          if keyboard_check.count(keyboard_marker) != 1:
              raise SystemExit("checks/messenger-android-keyboard-avoidance.mjs: marker not found")
          keyboard_check_path.write_text(
              keyboard_check.replace(keyboard_marker, keyboard_replacement, 1),
              encoding="utf-8",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused checks and TypeScript validation
        run: |
          npm run check:messenger-player-avatar
          npm run check:messenger-android-keyboard
          npm run typecheck

      - name: Generate and compile Android project
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/patch-avatar-ime.yml checks/avatar-ime-patch.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: harden avatar upload and Android IME compatibility"
          git push origin HEAD:fix/minor-fixes-batch
