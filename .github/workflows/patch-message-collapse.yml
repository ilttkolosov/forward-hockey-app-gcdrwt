name: One-time message collapse patch

on:
  push:
    branches:
      - fix/minor-fixes-batch

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[collapse-30-request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minor-fixes-batch
          fetch-depth: 0
      - name: Increase collapsed message preview to 30 lines
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/messenger/room/[id].tsx')
          text = path.read_text(encoding='utf-8')
          old_lines = 'const COLLAPSED_MESSAGE_LINES = 10;'
          old_chars = 'const COLLAPSED_MESSAGE_ESTIMATED_CHARACTERS = 360;'
          assert old_lines in text, 'old line threshold not found'
          assert old_chars in text, 'old character threshold not found'
          text = text.replace(old_lines, 'const COLLAPSED_MESSAGE_LINES = 30;', 1)
          text = text.replace(old_chars, 'const COLLAPSED_MESSAGE_ESTIMATED_CHARACTERS = 1_080;', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/messenger/room/[id].tsx'
          git commit -m "fix: show 30 message lines before collapse [versioned]"
          git push origin HEAD:fix/minor-fixes-batch
