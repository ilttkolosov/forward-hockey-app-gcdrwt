name: Native modules

on:
  push:
    branches:
      - main
      - stabilization/native-rich-text-input

jobs:
  android-native-module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EAS archive includes native module sources
        run: |
          if git check-ignore --no-index -q modules/forward-rich-text-input/android/build.gradle; then
            echo "Android module sources are excluded by ignore rules"
            exit 1
          fi
          if git check-ignore --no-index -q modules/forward-rich-text-input/ios/ForwardRichTextInputView.swift; then
            echo "iOS module sources are excluded by ignore rules"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android app and native modules
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --stacktrace

  ios-native-module:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Compile native rich text pod
        working-directory: ios
        run: >-
          xcodebuild
          -project Pods/Pods.xcodeproj
          -target ForwardRichTextInput
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Compile iOS share extension
        working-directory: ios
        run: >-
          xcodebuild
          -project ForwardHockey14.xcodeproj
          -target Forward14
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
