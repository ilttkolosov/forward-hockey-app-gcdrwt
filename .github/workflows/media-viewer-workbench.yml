name: Media viewer workbench
on:
  push:
    branches: [work/media-viewer-swipe-autoload]
permissions:
  contents: read
jobs:
  regression:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply locally verified completion and remove transport files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, subprocess, zlib
          folder = Path('.github/media-viewer-payload')
          encoded = ''.join(p.read_text().strip() for p in sorted(folder.glob('part*.b64')))
          encoded = encoded.replace('SC2MtKLBJhb', 'SC2MtKLBhb')
          data = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'a8a0371dff213dc2085b65165afd8f6e400ab64b20e197a540007eedb19e92a0'
          assert json.loads(Path('package.json').read_text())['version'] == '2.4.86'
          payload = json.loads(data)
          patch = Path('/tmp/media-viewer-completion.patch')
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          # Workflow cleanup is published separately through the GitHub connector.
          for p in folder.iterdir(): p.unlink()
          folder.rmdir()
          PY
          node scripts/bump-app-version.mjs patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finish shared MediaLightbox and explicit SVG bitmap ownership [versioned]'
          git push origin HEAD:work/media-viewer-swipe-autoload
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Install isolated test tools
        run: npm install --prefix /tmp/forward-pin-tests --no-package-lock --ignore-scripts react@19.1.0 react-test-renderer@19.1.0 prettier@3.6.2
      - name: Capture workbench source and test tools
        run: |
          mkdir -p /tmp/media-viewer-source
          tar --exclude=.git --exclude=node_modules --exclude=android --exclude=ios -czf /tmp/media-viewer-source/source.tgz .
          tar -czf /tmp/media-viewer-source/compiler-and-svg.tgz node_modules/typescript node_modules/react-native-svg
          tar -C /tmp/forward-pin-tests -czf /tmp/media-viewer-source/test-runtime.tgz node_modules
          git rev-parse HEAD > /tmp/media-viewer-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: media-viewer-source
          path: /tmp/media-viewer-source
          retention-days: 3
      - name: Media viewer runtime regressions
        env:
          PIN_TEST_MODULES: /tmp/forward-pin-tests
        run: npm run check:media-viewer
      - name: Full checks
        run: npm run check
      - name: Bundle Android and iOS JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --platform ios --output-dir /tmp/forward-media-export
  ios-svg:
    needs: regression
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native SVG baseline versus owned bitmap
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/ios-media-lifecycle-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-svg-regression
          path: /tmp/ios-media-lifecycle-results
          retention-days: 7
  ios-viewer:
    needs: regression
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Native gestures in shared viewer and profile media
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/media-viewer-native-smoke.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-viewer-regression
          path: /tmp/media-viewer-native-results
          retention-days: 7
  android-viewer:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 checks/media-viewer-native-smoke.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-viewer-regression
          path: /tmp/media-viewer-native-results
          retention-days: 7
