name: Media viewer workbench
on:
  push:
    branches: [work/media-viewer-swipe-fix]
    paths: [.github/workflows/media-viewer-workbench.yml]
permissions:
  contents: read
jobs:
  graphics:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/update-svg-regression.py
      - name: Reproduce shipped warning and verify owned bitmap
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/ios-media-lifecycle-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-owned-bitmap-native
          path: /tmp/ios-media-lifecycle-results
          retention-days: 7
