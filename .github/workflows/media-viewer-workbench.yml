name: Media viewer workbench
on:
  push:
    branches: [work/media-viewer-swipe-autoload]
permissions:
  contents: read
jobs:
  regression:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize native pager coexistence
        run: |
          if [ -f .github/media-viewer-simultaneous.patch ]; then
            node -e 'if(require("./package.json").version !== "2.4.88") process.exit(1)'
            python3 - <<'PY'
          from pathlib import Path

          zoom = Path('features/messenger/MessengerZoomableMedia.tsx')
          text = zoom.read_text()
          old = '''    // A horizontal drag fails our pan; downward movement belongs to the page.
              if (pagerGesture) {
                pan.blocksExternalGesture(pagerGesture);
                pinch.blocksExternalGesture(pagerGesture);
              }
          '''
          new = '''    // Do not make the native pager wait for the photo recognizers. At 1x the
              // pager and the media gestures observe the same stream: horizontal motion
              // is handled by FlatList, while a dominant downward motion activates our
              // dismiss pan. When zoomed, MediaLightbox disables FlatList scrolling.
              if (pagerGesture) {
                pan.simultaneousWithExternalGesture(pagerGesture);
                pinch.simultaneousWithExternalGesture(pagerGesture);
              }
          '''
          if old not in text:
              raise SystemExit('zoom pager relation block not found')
          zoom.write_text(text.replace(old, new, 1))

          runtime = Path('checks/media-viewer-runtime.cjs')
          text = runtime.read_text()
          old = '''  assert.ok(pan.config.blocksExternalGesture);
            assert.ok(pinch.config.blocksExternalGesture);
          '''
          new = '''  assert.ok(pan.config.simultaneousWithExternalGesture);
            assert.ok(pinch.config.simultaneousWithExternalGesture);
            assert.equal(pan.config.blocksExternalGesture, undefined);
            assert.equal(pinch.config.blocksExternalGesture, undefined);
          '''
          if old not in text:
              raise SystemExit('runtime relation assertions not found')
          runtime.write_text(text.replace(old, new, 1))

          smoke = Path('checks/media-viewer-native-smoke.py')
          text = smoke.read_text()
          replacements = [
              ('- assertVisible: "2 из 5"\n- extendedWaitUntil:\n    visible:\n      id: viewer-image-fixture-1',
               '- extendedWaitUntil:\n    visible: "2 из 5"\n    timeout: 5000\n- extendedWaitUntil:\n    visible:\n      id: viewer-image-fixture-1'),
              ('- assertVisible: "3 из 5"\n- extendedWaitUntil:\n    visible:\n      id: viewer-video-fixture-2',
               '- extendedWaitUntil:\n    visible: "3 из 5"\n    timeout: 5000\n- extendedWaitUntil:\n    visible:\n      id: viewer-video-fixture-2'),
              ('- assertVisible: "4 из 5"\n- extendedWaitUntil:\n    visible:\n      id: viewer-image-fixture-3',
               '- extendedWaitUntil:\n    visible: "4 из 5"\n    timeout: 5000\n- extendedWaitUntil:\n    visible:\n      id: viewer-image-fixture-3'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('native smoke assertion block not found')
              text = text.replace(old, new, 1)
          smoke.write_text(text)
          PY
            rm .github/media-viewer-simultaneous.patch
            node scripts/bump-app-version.mjs patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'fix: let media pager coexist with zoom and dismiss gestures [versioned]'
            git push origin HEAD:work/media-viewer-swipe-autoload
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Install isolated test tools
        run: npm install --prefix /tmp/forward-pin-tests --no-package-lock --ignore-scripts react@19.1.0 react-test-renderer@19.1.0 prettier@3.6.2
      - name: Capture workbench source and test tools
        run: |
          mkdir -p /tmp/media-viewer-source
          tar --exclude=.git --exclude=node_modules --exclude=android --exclude=ios -czf /tmp/media-viewer-source/source.tgz .
          tar -czf /tmp/media-viewer-source/compiler-and-svg.tgz node_modules/typescript node_modules/react-native-svg node_modules/react-native-gesture-handler
          tar -C /tmp/forward-pin-tests -czf /tmp/media-viewer-source/test-runtime.tgz node_modules
          git rev-parse HEAD > /tmp/media-viewer-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: media-viewer-source
          path: /tmp/media-viewer-source
          retention-days: 3
      - name: Media viewer runtime regressions
        env:
          PIN_TEST_MODULES: /tmp/forward-pin-tests
        run: npm run check:media-viewer
      - name: Full checks
        run: npm run check
      - name: Bundle Android and iOS JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --platform ios --output-dir /tmp/forward-media-export
  ios-svg:
    needs: regression
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native SVG baseline versus owned bitmap
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/ios-media-lifecycle-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-svg-regression
          path: /tmp/ios-media-lifecycle-results
          retention-days: 7
  ios-viewer:
    needs: regression
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Native gestures in shared viewer and profile media
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/media-viewer-native-smoke.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-viewer-regression
          path: /tmp/media-viewer-native-results
          retention-days: 7
  android-viewer:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 checks/media-viewer-native-smoke.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-viewer-regression
          path: /tmp/media-viewer-native-results
          retention-days: 7
