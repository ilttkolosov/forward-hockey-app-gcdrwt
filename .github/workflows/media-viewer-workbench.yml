name: Media viewer workbench
on:
  push:
    branches: [work/media-viewer-swipe-autoload]
permissions:
  contents: read
jobs:
  regression:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize native pager coexistence
        run: |
          if [ -f .github/media-viewer-simultaneous.patch ]; then
            node -e 'if(require("./package.json").version !== "2.4.88") process.exit(1)'
            git apply --check --index .github/media-viewer-simultaneous.patch
            git apply --index .github/media-viewer-simultaneous.patch
            rm .github/media-viewer-simultaneous.patch
            node scripts/bump-app-version.mjs patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'fix: let media pager coexist with zoom and dismiss gestures [versioned]'
            git push origin HEAD:work/media-viewer-swipe-autoload
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Install isolated test tools
        run: npm install --prefix /tmp/forward-pin-tests --no-package-lock --ignore-scripts react@19.1.0 react-test-renderer@19.1.0 prettier@3.6.2
      - name: Capture workbench source and test tools
        run: |
          mkdir -p /tmp/media-viewer-source
          tar --exclude=.git --exclude=node_modules --exclude=android --exclude=ios -czf /tmp/media-viewer-source/source.tgz .
          tar -czf /tmp/media-viewer-source/compiler-and-svg.tgz node_modules/typescript node_modules/react-native-svg node_modules/react-native-gesture-handler
          tar -C /tmp/forward-pin-tests -czf /tmp/media-viewer-source/test-runtime.tgz node_modules
          git rev-parse HEAD > /tmp/media-viewer-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: media-viewer-source
          path: /tmp/media-viewer-source
          retention-days: 3
      - name: Media viewer runtime regressions
        env:
          PIN_TEST_MODULES: /tmp/forward-pin-tests
        run: npm run check:media-viewer
      - name: Full checks
        run: npm run check
      - name: Bundle Android and iOS JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --platform ios --output-dir /tmp/forward-media-export
  ios-svg:
    needs: regression
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native SVG baseline versus owned bitmap
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/ios-media-lifecycle-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-svg-regression
          path: /tmp/ios-media-lifecycle-results
          retention-days: 7
  ios-viewer:
    needs: regression
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Native gestures in shared viewer and profile media
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/media-viewer-native-smoke.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-viewer-regression
          path: /tmp/media-viewer-native-results
          retention-days: 7
  android-viewer:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.regression.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 checks/media-viewer-native-smoke.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-viewer-regression
          path: /tmp/media-viewer-native-results
          retention-days: 7
