name: Verify media viewer gestures
on:
  push:
    branches: [work/media-viewer-swipe-fix]
    paths: [.github/workflows/media-viewer-verify.yml]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integrations
        run: |
          python3 scripts/update-svg-regression.py
          python3 scripts/update-media-viewer.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json');s=json.loads(p.read_text());s['scripts']['check:media-viewer']='node checks/media-viewer-runtime.cjs';p.write_text(json.dumps(s,indent=2)+'\n')
          PY
      - run: npm ci
      - run: npx --yes prettier@3.9.6 --write checks/media-viewer-runtime.cjs checks/ios-media-patch-contract.cjs features/messenger/MessengerZoomableMedia.tsx features/messenger/MessengerMediaViewer.tsx features/messenger/MessengerProfileMediaTab.tsx features/messenger/MessengerAttachmentView.tsx features/messenger/mediaViewerPolicy.ts features/messenger/useMediaViewerLoading.ts
      - run: npm run check
      - run: npm install --prefix /tmp/forward-pin-tests --no-package-lock --ignore-scripts react@19.1.0 react-test-renderer@19.1.0
      - name: Runtime regression tests
        env:
          PIN_TEST_MODULES: /tmp/forward-pin-tests
        run: |
          npm run check:media-viewer
          node checks/messenger-pins-runtime.cjs
          node checks/messenger-pin-presentation.cjs
      - name: Export both platforms
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform ios --platform android --output-dir /tmp/viewer-export
      - name: Commit verified source
        run: |
          node scripts/bump-app-version.mjs patch
          rm scripts/update-media-viewer.py scripts/update-svg-regression.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.config.js package.json package-lock.json checks features/messenger scripts/update-media-viewer.py scripts/update-svg-regression.py
          git commit -m 'feat: add viewer swipe dismissal and automatic media loading [versioned]'
          git push origin HEAD:work/media-viewer-swipe-fix
      - name: Source snapshot
        if: always()
        run: |
          mkdir -p /tmp/viewer-verified
          tar --exclude=.git --exclude=node_modules --exclude=android --exclude=ios --exclude=assets -czf /tmp/viewer-verified/source.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-viewer-verified-source
          path: /tmp/viewer-verified
          retention-days: 3
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: python3 scripts/update-media-viewer.py
      - run: python3 checks/media-viewer-native-smoke.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-viewer-native-ios
          path: /tmp/media-viewer-native-results
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: python3 scripts/update-media-viewer.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 checks/media-viewer-native-smoke.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-viewer-native-android
          path: /tmp/media-viewer-native-results
          retention-days: 7
