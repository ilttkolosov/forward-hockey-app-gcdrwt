name: Verify media viewer gestures
on:
  push:
    branches: [work/media-viewer-swipe-fix]
    paths: [.github/workflows/media-viewer-verify.yml]
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Select an XCTest runtime compatible with the selected SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checks/media-viewer-native-smoke.py');s=p.read_text()
          s=s.replace("        device=next(d for r in sorted(devices,reverse=True) if '.iOS-' in r for d in devices[r] if d['name'].startswith('iPhone'))", "        sdk = subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-version'],text=True).strip().split('.')\n        runtime = '.iOS-'+'-'.join(sdk[:2])\n        candidates = [d for r in devices if runtime in r for d in devices[r] if d['name'].startswith('iPhone')]\n        assert candidates, 'No simulator matching active Xcode SDK '+runtime\n        device = candidates[0]\n        (OUT/'simulator.json').write_text(json.dumps(device,indent=2))")
          s=s.replace("        app=next((derived/'Build/Products/Release-iphonesimulator').glob('*.app'))", "        run(['open','-a','Simulator'],host,'simulator-ui')\n        app=next((derived/'Build/Products/Release-iphonesimulator').glob('*.app'))")
          p.write_text(s)
          PY
          xcodebuild -version
      - run: python3 checks/media-viewer-native-smoke.py ios
      - name: Preserve verified test harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checks/media-viewer-native-smoke.py
          git diff --cached --quiet || git commit -m 'test: verify native media gestures with matching XCTest runtime [versioned]'
          git push origin HEAD:work/media-viewer-swipe-fix
      - name: Collect driver and host diagnostics
        if: always()
        run: |
          mkdir -p /tmp/media-viewer-native-results/driver
          cp checks/media-viewer-native-smoke.py /tmp/media-viewer-native-results/verified-test.py
          cp -R "$HOME/.maestro/tests" /tmp/media-viewer-native-results/driver/ 2>/dev/null || true
          cp -R "$HOME/.maestro/logs" /tmp/media-viewer-native-results/driver/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-viewer-native-ios
          path: /tmp/media-viewer-native-results
          retention-days: 7
