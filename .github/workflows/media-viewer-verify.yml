name: Verify media viewer gestures
on:
  push:
    branches: [work/media-viewer-swipe-fix]
    paths: [.github/workflows/media-viewer-verify.yml]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Complete isolated host build dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checks/media-viewer-native-smoke.py');s=p.read_text().replace("names=['expo',", "names=['@babel/core','babel-preset-expo','expo',");p.write_text(s)
          PY
      - run: python3 checks/media-viewer-native-smoke.py ios
      - run: cp checks/media-viewer-native-smoke.py /tmp/media-viewer-native-results/verified-test.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-viewer-native-ios
          path: /tmp/media-viewer-native-results
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Complete isolated host build dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checks/media-viewer-native-smoke.py');s=p.read_text().replace("names=['expo',", "names=['@babel/core','babel-preset-expo','expo',");p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 checks/media-viewer-native-smoke.py android
      - run: cp checks/media-viewer-native-smoke.py /tmp/media-viewer-native-results/verified-test.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-viewer-native-android
          path: /tmp/media-viewer-native-results
          retention-days: 7
