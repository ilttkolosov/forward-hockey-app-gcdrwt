name: One-time Android keyboard overlay patch

on:
  push:
    branches:
      - fix/minor-fixes-batch

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[android-keyboard-overlay-patch]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minor-fixes-batch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply residual IME avoidance
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              assert count == 1, f"Expected one match in {path}, found {count}: {old[:80]!r}"
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          room = Path("app/messenger/room/[id].tsx")
          replace_once(
              room,
              'import { useTypingDots } from "../../../features/messenger/useTypingDots";\n',
              'import { useTypingDots } from "../../../features/messenger/useTypingDots";\n'
              'import { useAndroidKeyboardAvoidance } from "../../../features/messenger/useAndroidKeyboardAvoidance";\n',
          )
          replace_once(
              room,
              '  const listRef = useRef<FlatList<MessengerMessage>>(null);\n'
              '  const inputRef = useRef<ForwardRichTextInputHandle>(null);\n',
              '  const listRef = useRef<FlatList<MessengerMessage>>(null);\n'
              '  const inputRef = useRef<ForwardRichTextInputHandle>(null);\n'
              '  const composerShellRef = useRef<View>(null);\n'
              '  const {\n'
              '    bottomInset: androidKeyboardInset,\n'
              '    onTargetLayout: handleComposerShellLayout,\n'
              '    refresh: refreshAndroidKeyboardAvoidance,\n'
              '  } = useAndroidKeyboardAvoidance(composerShellRef);\n',
          )
          replace_once(
              room,
              '  useEffect(() => {\n'
              '    messagesRef.current = messages;\n'
              '  }, [messages]);\n',
              '  useEffect(() => {\n'
              '    messagesRef.current = messages;\n'
              '  }, [messages]);\n\n'
              '  useEffect(() => {\n'
              '    if (Platform.OS !== "android" || androidKeyboardInset <= 0) return;\n'
              '    messengerLog("info", "room.keyboard.overlay_compensated", {\n'
              '      room_id: roomId,\n'
              '      bottom_inset: androidKeyboardInset,\n'
              '    });\n'
              '  }, [androidKeyboardInset, roomId]);\n',
          )
          replace_once(
              room,
              '        {canWrite ? (\n'
              '          <View style={styles.composerShell}>\n',
              '        {canWrite ? (\n'
              '          <View\n'
              '            ref={composerShellRef}\n'
              '            collapsable={false}\n'
              '            onLayout={handleComposerShellLayout}\n'
              '            style={[\n'
              '              styles.composerShell,\n'
              '              Platform.OS === "android" && androidKeyboardInset > 0\n'
              '                ? { marginBottom: androidKeyboardInset }\n'
              '                : null,\n'
              '            ]}\n'
              '          >\n',
          )
          replace_once(
              room,
              '                onFocus={() => {\n'
              '                  setComposerFocused(true);\n'
              '                  if (!nearLatest.current) return;\n',
              '                onFocus={() => {\n'
              '                  setComposerFocused(true);\n'
              '                  if (Platform.OS === "android") {\n'
              '                    refreshAndroidKeyboardAvoidance();\n'
              '                  }\n'
              '                  if (!nearLatest.current) return;\n',
          )

          native = Path(
              "modules/forward-rich-text-input/android/src/main/java/com/forwardhockey/richtext/ForwardRichTextInputView.kt"
          )
          replace_once(
              native,
              'import android.annotation.SuppressLint\n'
              'import android.content.ClipDescription\n'
              'import android.content.Context\n',
              'import android.annotation.SuppressLint\n'
              'import android.app.Activity\n'
              'import android.content.ClipDescription\n'
              'import android.content.Context\n'
              'import android.content.ContextWrapper\n',
          )
          replace_once(
              native,
              'import android.view.View\n'
              'import android.view.inputmethod.InputMethodManager\n',
              'import android.view.View\n'
              'import android.view.WindowManager\n'
              'import android.view.inputmethod.InputMethodManager\n',
          )
          replace_once(
              native,
              'import java.util.UUID\n\n'
              'private class ForwardRichEditText(context: Context) : EditText(context) {\n',
              'import java.util.UUID\n\n'
              'private tailrec fun Context.findActivity(): Activity? = when (this) {\n'
              '  is Activity -> this\n'
              '  is ContextWrapper -> baseContext.findActivity()\n'
              '  else -> null\n'
              '}\n\n'
              'private class ForwardRichEditText(context: Context) : EditText(context) {\n',
          )
          replace_once(
              native,
              '  private var lastContentHeight = -1\n'
              '  private val recentlyEmittedEncodedValues = ArrayDeque<String>()\n\n'
              '  private val formatMenuIds = mapOf(\n',
              '  private var lastContentHeight = -1\n'
              '  private val recentlyEmittedEncodedValues = ArrayDeque<String>()\n\n'
              '  private fun enforceImeResize() {\n'
              '    val window = context.findActivity()?.window ?: return\n'
              '    val currentMode = window.attributes.softInputMode\n'
              '    val nextMode =\n'
              '      (currentMode and WindowManager.LayoutParams.SOFT_INPUT_MASK_ADJUST.inv()) or\n'
              '        WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE\n'
              '    if (nextMode != currentMode) window.setSoftInputMode(nextMode)\n'
              '  }\n\n'
              '  private val formatMenuIds = mapOf(\n',
          )
          replace_once(
              native,
              '    editor.setOnFocusChangeListener { _, hasFocus ->\n'
              '      if (hasFocus) onFocus(Unit) else onBlur(Unit)\n'
              '    }\n',
              '    editor.setOnFocusChangeListener { _, hasFocus ->\n'
              '      if (hasFocus) {\n'
              '        enforceImeResize()\n'
              '        onFocus(Unit)\n'
              '      } else {\n'
              '        onBlur(Unit)\n'
              '      }\n'
              '    }\n',
          )
          replace_once(
              native,
              '  fun focusEditor() {\n'
              '    editor.post {\n'
              '      editor.requestFocus()\n',
              '  fun focusEditor() {\n'
              '    editor.post {\n'
              '      enforceImeResize()\n'
              '      editor.requestFocus()\n',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused checks and TypeScript validation
        run: |
          node --no-warnings --experimental-strip-types checks/messenger-android-keyboard-avoidance.mjs
          npm run typecheck

      - name: Generate and compile Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit Android keyboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/messenger/room/[id].tsx' \
            'modules/forward-rich-text-input/android/src/main/java/com/forwardhockey/richtext/ForwardRichTextInputView.kt'
          git commit -m "fix: keep Android chat composer above keyboard [versioned]"
          git push origin HEAD:fix/minor-fixes-batch
