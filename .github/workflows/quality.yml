name: Quality checks

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - feature/appstore-2.0.1-compliance
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle Android JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --output-dir /tmp/forward-hockey-export

      - name: Typecheck and lint
        run: npm run check

      - name: Verify pinned message ordering and previews
        run: node --no-warnings --experimental-strip-types checks/messenger-pins.mjs

      - name: Install isolated React test runtime
        run: npm install --prefix /tmp/forward-pin-tests --no-package-lock --ignore-scripts react@19.1.0 react-test-renderer@19.1.0

      - name: Verify pin menu during competing chat requests
        env:
          PIN_TEST_MODULES: /tmp/forward-pin-tests
        run: node checks/messenger-pins-runtime.cjs

      - name: Validate Expo config
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
        run: npx expo config --type public
