name: Quality checks

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - feature/appstore-2.0.1-compliance
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle Android JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --output-dir /tmp/forward-hockey-export

      - name: Typecheck and lint
        run: npm run check

      - name: Validate Expo config
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
        run: npx expo config --type public
