name: Pin presentation verification
on:
  push:
    branches: [work/pin-banner-polish]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, 'apply verified')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pin-banner-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply chat integration
        run: |
          python scripts/apply-pin-polish.py
          rm scripts/apply-pin-polish.py
          git diff --check
      - run: npm ci
      - name: Format new modules
        run: npx --yes prettier@3.9.6 --write features/messenger/pins.ts features/messenger/PinnedMessagesBanner.tsx features/messenger/PinnedMediaThumbnail.tsx features/messenger/PinnedMediaThumbnail.web.tsx features/messenger/usePinnedMessageSelection.ts services/messengerPinVideoThumbnail.ts checks/messenger-pins.mjs checks/messenger-pin-presentation.cjs
      - run: npm install --prefix /tmp/forward-pin-tests --no-package-lock --ignore-scripts react@19.1.0 react-test-renderer@19.1.0
      - name: Verify pin chronology, presentation and previous menu fix
        env:
          PIN_TEST_MODULES: /tmp/forward-pin-tests
        run: |
          node --no-warnings --experimental-strip-types checks/messenger-pins.mjs
          node checks/messenger-pin-presentation.cjs
          node checks/messenger-pins-runtime.cjs
      - run: npm run check
      - name: Bundle native JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo export --platform android --output-dir /tmp/pin-export-android
          npx expo export --platform ios --output-dir /tmp/pin-export-ios
      - name: Commit verified source
        run: |
          node scripts/bump-app-version.mjs patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/messenger/room/'[id].tsx' features/messenger/pins.ts features/messenger/PinnedMessagesBanner.tsx features/messenger/PinnedMediaThumbnail.tsx features/messenger/PinnedMediaThumbnail.web.tsx features/messenger/usePinnedMessageSelection.ts services/messengerPinVideoThumbnail.ts checks/messenger-pins.mjs checks/messenger-pin-presentation.cjs docs/CHAT_PINNING.md scripts/apply-pin-polish.py app.config.js package.json package-lock.json
          git commit -m 'feat: apply verified pinned banner presentation [versioned]'
          git push origin HEAD:work/pin-banner-polish
      - name: Export verification snapshot
        if: always()
        run: |
          mkdir -p /tmp/pin-polish-artifacts
          tar --exclude=.git --exclude=node_modules --exclude=assets --exclude=android --exclude=ios -czf /tmp/pin-polish-artifacts/source.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-polish-source
          path: /tmp/pin-polish-artifacts
          retention-days: 1
