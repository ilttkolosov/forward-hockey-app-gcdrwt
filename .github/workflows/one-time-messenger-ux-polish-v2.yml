name: One-time messenger UX polish v2

on:
  push:
    branches:
      - fix/minor-fixes-batch
    paths:
      - .github/workflows/one-time-messenger-ux-polish-v2.yml
      - scripts/run-messenger-ux-polish-v2.mjs
      - scripts/one-time-messenger-ux-polish.mjs

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/minor-fixes-batch
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply messenger UX patch
        run: node scripts/run-messenger-ux-polish-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format touched files
        run: >-
          npx prettier --write
          components/PersistentBottomNavigation.tsx
          features/messenger/MessageReceiptsModal.tsx
          app/messenger/group/[id].tsx
          app/messenger/room/[id].tsx

      - name: Bundle Android JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --output-dir /tmp/forward-hockey-export

      - name: Typecheck and lint
        run: npm run check

      - name: Validate Expo config
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
        run: npx expo config --type public

      - name: Commit validated changes and remove one-time patchers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/run-messenger-ux-polish-v2.mjs scripts/one-time-messenger-ux-polish.mjs .github/workflows/one-time-messenger-ux-polish-v2.yml
          git add components/PersistentBottomNavigation.tsx features/messenger/MessageReceiptsModal.tsx 'app/messenger/group/[id].tsx' 'app/messenger/room/[id].tsx'
          git commit -m "fix: apply messenger detail UX changes [versioned]"
          git push origin HEAD:fix/minor-fixes-batch
