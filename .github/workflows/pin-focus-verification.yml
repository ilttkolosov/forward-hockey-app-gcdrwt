name: Pin focus verification
on:
  push:
    branches: [work/pin-focus-stability]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, 'verified pin focus')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pin-focus-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-pin-focus.py
      - run: npm ci
      - run: npx --yes prettier@3.9.6 --write features/messenger/messageFocus.ts features/messenger/PinnedMessagesBanner.tsx checks/messenger-pin-focus.mjs
      - run: npm install --prefix /tmp/forward-pin-tests --no-package-lock --ignore-scripts react@19.1.0 react-test-renderer@19.1.0
      - name: Focus and prior pin regressions
        env:
          PIN_TEST_MODULES: /tmp/forward-pin-tests
        run: |
          node --no-warnings --experimental-strip-types checks/messenger-pin-focus.mjs
          node --no-warnings --experimental-strip-types checks/messenger-pins.mjs
          node checks/messenger-pins-runtime.cjs
          node checks/messenger-pin-presentation.cjs
      - run: npm run check
      - name: Bundle iOS and Android JavaScript
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo export --platform android --output-dir /tmp/pin-focus-android
          npx expo export --platform ios --output-dir /tmp/pin-focus-ios
      - name: Commit verified pin focus
        run: |
          node scripts/bump-app-version.mjs patch
          rm scripts/apply-pin-focus.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/messenger/room/'[id].tsx' features/messenger/messageFocus.ts features/messenger/PinnedMessagesBanner.tsx checks/messenger-pin-focus.mjs docs/CHAT_PINNING.md scripts/apply-pin-focus.py app.config.js package.json package-lock.json
          git commit -m 'fix: apply verified pin focus completion [versioned]'
          git push origin HEAD:work/pin-focus-stability
      - name: Export source
        if: always()
        run: |
          mkdir -p /tmp/pin-focus-source
          tar --exclude=.git --exclude=node_modules --exclude=assets --exclude=android --exclude=ios -czf /tmp/pin-focus-source/source.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-focus-source
          path: /tmp/pin-focus-source
          retention-days: 1
