name: One-time resilient iOS registration patch v2

on:
  push:
    branches:
      - fix/minor-fixes-batch

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[ios-registration-patch-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minor-fixes-batch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply registration reliability changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/patch-ios-registration.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ) + '\n'

          interface_start = body.index("replace_once(\n    auth_path,\n    dedent('''\n      register(payload: {")
          interface_end = body.index("\nauth_register = dedent('''", interface_start)
          interface_patch = dedent('''
          old_auth_register_contract = """  register(payload: {
            invite_token: string;
            username: string;
            password: string;
            display_name?: string;
            email?: string;
            expected_player_id?: number | string | null;
          }): Promise<void>;"""
          new_auth_register_contract = """  register(payload: {
            invite_token: string;
            username: string;
            password: string;
            display_name?: string;
            email?: string;
            expected_player_id?: number | string | null;
            rules: {
              version: string;
              sha256: string;
              confirmation_method: \"registration_checkbox\";
              app_version: string;
              app_build?: string;
            };
          }): Promise<void>;"""
          replace_once(
              auth_path,
              old_auth_register_contract,
              new_auth_register_contract,
          )
          ''')
          body = body[:interface_start] + interface_patch.rstrip() + body[interface_end:]
          exec(compile(body, '<ios-registration-patch>', 'exec'))

          register_path = Path('app/messenger/register.tsx')
          text = register_path.read_text(encoding='utf-8')
          old_keyboard = '''async function dismissKeyboardBeforeRules(): Promise<void> {
            const keyboard = Keyboard as typeof Keyboard & {
              isVisible?: () => boolean;
            };
            const wasVisible =
              Platform.OS === "ios" && keyboard.isVisible?.() === true;
            Keyboard.dismiss();
            if (!wasVisible) {
              await new Promise<void>((resolve) =>
                requestAnimationFrame(() => resolve()),
              );
              return;
            }
            await new Promise<void>((resolve) => {
              let settled = false;
              let timeout: ReturnType<typeof setTimeout> | null = null;
              const subscription = Keyboard.addListener("keyboardDidHide", finish);
              function finish() {
                if (settled) return;
                settled = true;
                subscription.remove();
                if (timeout) clearTimeout(timeout);
                requestAnimationFrame(() => resolve());
              }
              timeout = setTimeout(finish, 420);
            });
          }'''
          new_keyboard = '''async function dismissKeyboardBeforeRules(): Promise<void> {
            const keyboard = Keyboard as typeof Keyboard & {
              isVisible?: () => boolean;
            };
            const metrics = Keyboard.metrics();
            const wasVisible =
              Platform.OS === "ios" &&
              (keyboard.isVisible?.() === true || Boolean(metrics?.height));
            Keyboard.dismiss();
            if (Platform.OS !== "ios") {
              await new Promise<void>((resolve) =>
                requestAnimationFrame(() => resolve()),
              );
              return;
            }
            if (!wasVisible) {
              // Even after the keyboard is no longer visible, iOS may still be
              // finishing the previous UITextInput session for a short time.
              await new Promise<void>((resolve) => setTimeout(resolve, 120));
              return;
            }
            await new Promise<void>((resolve) => {
              let settled = false;
              let timeout: ReturnType<typeof setTimeout> | null = null;
              const subscription = Keyboard.addListener("keyboardDidHide", finish);
              function finish() {
                if (settled) return;
                settled = true;
                subscription.remove();
                if (timeout) clearTimeout(timeout);
                requestAnimationFrame(() => resolve());
              }
              timeout = setTimeout(finish, 480);
            });
          }'''
          if old_keyboard not in text:
              raise SystemExit('Generated keyboard-dismiss helper was not found')
          register_path.write_text(text.replace(old_keyboard, new_keyboard, 1), encoding='utf-8')
          Path('.github/workflows/patch-ios-registration-v2.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format and validate
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx prettier --write features/messenger/MessengerRulesModal.tsx app/messenger/register.tsx contexts/MessengerAuthContext.tsx services/messengerApi.ts checks/messenger-ios-registration.mjs package.json
          npm run check:messenger-ios-registration
          npm run typecheck
          npx eslint features/messenger/MessengerRulesModal.tsx app/messenger/register.tsx contexts/MessengerAuthContext.tsx services/messengerApi.ts checks/messenger-ios-registration.mjs
          npx expo export --platform ios --output-dir /tmp/forward-hockey-ios-registration-export

      - name: Commit client changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make rules registration resilient on iOS"
          git push origin HEAD:fix/minor-fixes-batch
