name: Verify iOS pin thumbnail crash
on:
  push:
    branches: [work/ios-pin-thumbnail-crash]
    paths:
      - .github/workflows/ios-pin-thumbnail-workbench.yml
permissions:
  contents: write
concurrency:
  group: ios-pin-thumbnail-workbench
  cancel-in-progress: true
jobs:
  native-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ios-pin-thumbnail-crash
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe display of already decoded native image refs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('checks/ios-pin-thumbnail-smoke.py')
          s = p.read_text()
          assert s.count('onLoad: async () => {') == 1
          s = s.replace('onLoad: async () => {', 'onDisplay: async () => {')
          s = s.replace('onLoad={picture.onLoad}', 'onDisplay={picture.onDisplay}')
          s = s.replace("      cleanup = request(uri, undefined, (frame) => {", "      // Native SharedRef images are already decoded: onDisplay, not network onLoad.\n      cleanup = request(uri, undefined, (frame) => {")
          old = "        run(['xcrun', 'simctl', 'terminate', udid, BUNDLE], host, 'terminate-' + mode, check=False)"
          assert old in s
          s = s.replace(old, "        if mode != 'baseline':\n            run(['xcrun', 'simctl', 'terminate', udid, BUNDLE], host, 'terminate-' + mode, timeout=60, check=False)")
          p.write_text(s)
          PY
      - name: Run actual locked Expo video on an iOS simulator
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: python3 checks/ios-pin-thumbnail-smoke.py
      - name: Preserve verified simulator regression
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checks/ios-pin-thumbnail-smoke.py
          git commit -m 'test: verify iOS native frames through onDisplay [versioned]'
          git push origin HEAD:work/ios-pin-thumbnail-crash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-pin-thumbnail-native
          path: /tmp/ios-pin-thumbnail-native-results
          retention-days: 7
