name: One-time avatar and Android IME compatibility patch v2

on:
  push:
    branches:
      - fix/minor-fixes-batch

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[avatar-ime-compat-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minor-fixes-batch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply avatar upload and IME compatibility changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          def replace_between(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              start = content.find(start_marker)
              if start < 0:
                  raise SystemExit(f"Start marker not found in {path}: {start_marker!r}")
              end = content.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"End marker not found in {path}: {end_marker!r}")
              file.write_text(content[:start] + replacement + content[end:], encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              file.write_text(content.replace(old, new, 1), encoding="utf-8")

          api_path = "services/messengerApi.ts"
          avatar_uploader = dedent('''
          interface MessengerAvatarUploadFile {
            uri: string;
            name: string;
            type: string;
          }

          interface MessengerAvatarUploadResult {
            asset_id: string;
            url: string;
          }

          const MESSENGER_AVATAR_UPLOAD_TIMEOUT_MS = 90_000;

          function uploadMessengerAvatarLegacy(
            path: string,
            file: MessengerAvatarUploadFile,
          ): Promise<MessengerAvatarUploadResult> {
            const form = new FormData();
            form.append("file", file as unknown as Blob);
            return messengerRequest<MessengerAvatarUploadResult>(path, {
              method: "PUT",
              body: form,
            });
          }

          async function uploadMessengerAvatarFile(
            path: string,
            file: MessengerAvatarUploadFile,
            scope: "user" | "room",
            noRefresh = false,
          ): Promise<MessengerAvatarUploadResult> {
            const startedAt = Date.now();
            const requestId = messengerRequestId();
            let session = await loadMessengerSession();
            if (
              session?.refresh_token &&
              !isMessengerAccessTokenUsable(
                session.access_token,
                ACCESS_TOKEN_MIN_VALIDITY_MS,
              )
            ) {
              session = await ensureFreshMessengerSession();
            }
            if (!session?.access_token) {
              throw new MessengerApiError(
                "Необходим вход",
                401,
                "authentication_required",
              );
            }

            let uploadFile: ExpoFile;
            try {
              uploadFile = new ExpoFile(file.uri);
            } catch (error) {
              throw new Error(
                "Выбранное изображение недоступно для загрузки. Выберите фотографию заново",
                { cause: error },
              );
            }
            if (!uploadFile.exists || Number(uploadFile.size) < 1) {
              throw new Error(
                "Выбранное изображение недоступно для загрузки. Выберите фотографию заново",
              );
            }

            const form = new FormData();
            form.append("file", uploadFile as unknown as Blob, file.name);
            const controller = new AbortController();
            let timedOut = false;
            const timeout = setTimeout(() => {
              timedOut = true;
              controller.abort();
            }, MESSENGER_AVATAR_UPLOAD_TIMEOUT_MS);

            messengerLog("info", "api.avatar_upload.started", {
              request_id: requestId,
              scope,
              file_size_bytes: Number(uploadFile.size),
              file_type: file.type,
              timeout_ms: MESSENGER_AVATAR_UPLOAD_TIMEOUT_MS,
            });

            try {
              const response = await expoFetch(`${MESSENGER_API_BASE_URL}${path}`, {
                method: "PUT",
                headers: {
                  Accept: "application/json",
                  Authorization: `Bearer ${session.access_token}`,
                  "x-request-id": requestId,
                },
                body: form,
                signal: controller.signal,
              });
              const body = await response.text();
              const serverRequestId =
                response.headers.get("x-request-id") || requestId;
              messengerLog(
                response.ok ? "info" : "warn",
                "api.avatar_upload.response",
                {
                  request_id: serverRequestId,
                  client_request_id:
                    serverRequestId !== requestId ? requestId : undefined,
                  scope,
                  status: response.status,
                  duration_ms: Date.now() - startedAt,
                },
              );
              if (
                response.status === 401 &&
                !noRefresh &&
                Boolean(session.refresh_token)
              ) {
                await ensureFreshMessengerSession({ force: true });
                return uploadMessengerAvatarFile(path, file, scope, true);
              }
              return parseUploadResponse<MessengerAvatarUploadResult>(
                response.status,
                body,
              );
            } catch (error) {
              const normalized = timedOut
                ? new Error("Загрузка аватара превысила 90 секунд", {
                    cause: error,
                  })
                : error;
              messengerLog("warn", "api.avatar_upload.failure", {
                request_id: requestId,
                scope,
                duration_ms: Date.now() - startedAt,
                message: messengerErrorMessage(normalized),
              });
              throw normalized;
            } finally {
              clearTimeout(timeout);
            }
          }

          export function uploadMessengerAvatar(file: MessengerAvatarUploadFile) {
            if (Platform.OS === "web") {
              return uploadMessengerAvatarLegacy("/users/me/avatar", file);
            }
            return uploadMessengerAvatarFile("/users/me/avatar", file, "user");
          }
          ''').lstrip()
          replace_between(
              api_path,
              "export function uploadMessengerAvatar(file: {",
              "\n\nexport function removeMessengerAvatar()",
              avatar_uploader.rstrip(),
          )

          room_avatar_uploader = dedent('''
          export function uploadMessengerRoomAvatar(
            roomId: string,
            file: MessengerAvatarUploadFile,
          ) {
            const path = `/chat/rooms/${roomId}/avatar`;
            if (Platform.OS === "web") {
              return uploadMessengerAvatarLegacy(path, file);
            }
            return uploadMessengerAvatarFile(path, file, "room");
          }
          ''').lstrip()
          replace_between(
              api_path,
              "export function uploadMessengerRoomAvatar(",
              "\n\nexport function removeMessengerRoomAvatar",
              room_avatar_uploader.rstrip(),
          )

          Path("services/messengerAvatarPreparation.ts").write_text(
              dedent('''
              import { File as ExpoFile } from "expo-file-system";
              import * as ImageManipulator from "expo-image-manipulator";
              import { messengerLog } from "./messengerLogger";

              export interface MessengerPreparedAvatar {
                uri: string;
                name: string;
                type: "image/jpeg";
              }

              interface MessengerAvatarSource {
                uri: string;
                width?: number | null;
                height?: number | null;
              }

              const MAX_AVATAR_EDGE = 1_024;
              const AVATAR_JPEG_QUALITY = 0.82;

              function avatarResizeActions(
                width: number | null | undefined,
                height: number | null | undefined,
              ): ImageManipulator.Action[] {
                if (
                  typeof width !== "number" ||
                  typeof height !== "number" ||
                  !Number.isFinite(width) ||
                  !Number.isFinite(height) ||
                  width <= 0 ||
                  height <= 0 ||
                  Math.max(width, height) <= MAX_AVATAR_EDGE
                ) {
                  return [];
                }
                return [
                  {
                    resize:
                      width >= height
                        ? { width: MAX_AVATAR_EDGE }
                        : { height: MAX_AVATAR_EDGE },
                  },
                ];
              }

              function uriScheme(uri: string): string {
                return (
                  /^([a-z][a-z0-9+.-]*):/i.exec(uri)?.[1]?.toLowerCase() ??
                  "relative"
                );
              }

              /**
               * Materializes the picker/asset URI into a normal JPEG file before
               * multipart upload. This avoids Android content/resource URIs being
               * handed to React Native's legacy FormData bridge as a pseudo-file.
               */
              export async function prepareMessengerAvatarUpload(
                source: MessengerAvatarSource,
              ): Promise<MessengerPreparedAvatar> {
                const startedAt = Date.now();
                const sourceUri = source.uri.trim();
                if (!sourceUri) {
                  throw new Error("Путь к выбранному изображению пуст");
                }

                try {
                  const result = await ImageManipulator.manipulateAsync(
                    sourceUri,
                    avatarResizeActions(source.width, source.height),
                    {
                      compress: AVATAR_JPEG_QUALITY,
                      format: ImageManipulator.SaveFormat.JPEG,
                    },
                  );
                  const file = new ExpoFile(result.uri);
                  if (!file.exists || Number(file.size) < 1) {
                    throw new Error("Подготовленный файл изображения пуст");
                  }
                  messengerLog("info", "profile.avatar.prepared", {
                    source_uri_scheme: uriScheme(sourceUri),
                    file_size_bytes: Number(file.size),
                    width: result.width,
                    height: result.height,
                    duration_ms: Date.now() - startedAt,
                  });
                  return {
                    uri: result.uri,
                    name: `avatar-${Date.now()}.jpg`,
                    type: "image/jpeg",
                  };
                } catch (error) {
                  messengerLog("warn", "profile.avatar.prepare_failed", {
                    source_uri_scheme: uriScheme(sourceUri),
                    duration_ms: Date.now() - startedAt,
                    message: error instanceof Error ? error.message : "unknown",
                  });
                  throw new Error(
                    "Не удалось подготовить выбранное изображение. Выберите другую фотографию",
                    { cause: error },
                  );
                }
              }
              ''').lstrip(),
              encoding="utf-8",
          )

          profile_path = "app/messenger/profile.tsx"
          replace_once(
              profile_path,
              'import { messengerLog } from "../../services/messengerLogger";\n',
              'import { messengerLog } from "../../services/messengerLogger";\nimport { prepareMessengerAvatarUpload } from "../../services/messengerAvatarPreparation";\n',
          )
          profile_replacement = dedent('''
              try {
                const preparedAvatar = selectedAsset
                  ? Platform.OS === "web"
                    ? {
                        uri: selectedAsset.uri,
                        name:
                          selectedAsset.fileName || `avatar-${Date.now()}.jpg`,
                        type: selectedAsset.mimeType || "image/jpeg",
                      }
                    : await prepareMessengerAvatarUpload({
                        uri: selectedAsset.uri,
                        width: selectedAsset.width,
                        height: selectedAsset.height,
                      })
                  : null;
                await updateMessengerProfile(name);
                if (preparedAvatar) {
                  await uploadMessengerAvatar(preparedAvatar);
                }
                await refreshUser();
              ''').lstrip()
          replace_between(
              profile_path,
              "    try {\n      await updateMessengerProfile(name);",
              "      setSelectedAsset(null);",
              "    " + profile_replacement.replace("\n", "\n    "),
          )

          room_path = "app/messenger/room/[id].tsx"
          room_content = Path(room_path).read_text(encoding="utf-8")
          old_paste = dedent('''
                          pasteAttachmentsEnabled={
                            canMedia &&
                            !attachmentDraft &&
                            !editingMessage &&
                            !composerBusy
                          }
                          ''').lstrip()
          new_paste = dedent('''
                          // Android OEM keyboards can treat a custom commitContent
                          // InputConnection as a separate editor and lose language-subtype
                          // switching. Keep the normal IME connection on Android; users
                          // still retain text formatting and the attachment picker.
                          pasteAttachmentsEnabled={
                            Platform.OS !== "android" &&
                            canMedia &&
                            !attachmentDraft &&
                            !editingMessage &&
                            !composerBusy
                          }
                          ''').lstrip()
          if old_paste not in room_content:
              raise SystemExit("Android pasteAttachmentsEnabled block not found")
          Path(room_path).write_text(room_content.replace(old_paste, new_paste, 1), encoding="utf-8")

          Path("checks/messenger-avatar-ime-compat.mjs").write_text(
              dedent('''
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";

              const apiSource = readFileSync(
                new URL("../services/messengerApi.ts", import.meta.url),
                "utf8",
              );
              assert.match(apiSource, /new ExpoFile\(file\.uri\)/);
              assert.match(
                apiSource,
                /form\.append\("file", uploadFile as unknown as Blob, file\.name\)/,
              );
              assert.match(
                apiSource,
                /expoFetch\(`\$\{MESSENGER_API_BASE_URL\}\$\{path\}`/,
              );
              assert.match(apiSource, /api\.avatar_upload\.response/);

              const profileSource = readFileSync(
                new URL("../app/messenger/profile.tsx", import.meta.url),
                "utf8",
              );
              assert.match(profileSource, /prepareMessengerAvatarUpload\(\{/);
              assert.match(
                profileSource,
                /await uploadMessengerAvatar\(preparedAvatar\)/,
              );

              const roomSource = readFileSync(
                new URL("../app/messenger/room/[id].tsx", import.meta.url),
                "utf8",
              );
              assert.match(
                roomSource,
                /pasteAttachmentsEnabled=\{\s*Platform\.OS !== "android" &&/,
              );

              console.log(
                "Messenger avatar and Android IME compatibility checks passed.",
              );
              ''').lstrip(),
              encoding="utf-8",
          )

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          scripts["check:messenger-avatar-ime-compat"] = (
              "node --no-warnings --experimental-strip-types "
              "checks/messenger-avatar-ime-compat.mjs"
          )
          check = scripts["check"]
          marker = "npm run check:messenger-message-mutation && "
          addition = marker + "npm run check:messenger-avatar-ime-compat && "
          if "check:messenger-avatar-ime-compat" not in check:
              if marker not in check:
                  raise SystemExit("Unable to locate npm check insertion point")
              scripts["check"] = check.replace(marker, addition, 1)
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          for workflow in (
              ".github/workflows/patch-avatar-ime-compat.yml",
              ".github/workflows/patch-avatar-ime-compat-v2.yml",
          ):
              Path(workflow).unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate focused changes
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm run check:messenger-avatar-ime-compat
          npm run typecheck
          npx eslint services/messengerApi.ts services/messengerAvatarPreparation.ts app/messenger/profile.tsx 'app/messenger/room/[id].tsx' checks/messenger-avatar-ime-compat.mjs
          npx expo export --platform android --output-dir /tmp/forward-hockey-avatar-ime-export

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize avatar upload and Android IME"
          git push origin HEAD:fix/minor-fixes-batch
