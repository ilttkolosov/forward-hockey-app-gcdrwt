name: Verify Android media gestures
on:
  push:
    branches: [work/media-viewer-swipe-fix]
    paths: [.github/workflows/media-viewer-android-verify.yml]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Keep screenshots within Maestro output root
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checks/media-viewer-native-smoke.py');s=p.read_text()
          s=s.replace('- takeScreenshot: /tmp/media-viewer-native-results/', '- takeScreenshot: ')
          s=s.replace("'test','--debug-output',OUT/'maestro',OUT/'flow.yaml'", "'test','--test-output-dir',OUT/'maestro','--debug-output',OUT/'maestro',OUT/'flow.yaml'")
          p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 checks/media-viewer-native-smoke.py android
      - name: Collect test driver output
        if: always()
        run: |
          mkdir -p /tmp/media-viewer-native-results/driver
          cp checks/media-viewer-native-smoke.py /tmp/media-viewer-native-results/verified-test.py
          cp -R "$HOME/.maestro/tests" /tmp/media-viewer-native-results/driver/ 2>/dev/null || true
          cp -R "$HOME/.maestro/logs" /tmp/media-viewer-native-results/driver/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-viewer-native-android
          path: /tmp/media-viewer-native-results
          include-hidden-files: true
          retention-days: 7
